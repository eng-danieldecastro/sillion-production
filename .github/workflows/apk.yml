name: Gerar APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar dependências
        run: npm ci

      - name: Gerar app web e copiar para o Android
        env:
          VITE_VERSAO: 1.0.${{ github.run_number }}
        run: npm run android:sync

      - name: Restaurar chave de assinatura (segredos do repositório)
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_SENHA_BRUTA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          KEYSTORE_SENHA=$(printf "%s" "$KEYSTORE_SENHA_BRUTA" | tr -d " \r\n\t")
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_SENHA" ]; then
            echo "::error::Cadastre os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA em Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p keystore
          LIMPO=$(printf "%s" "$KEYSTORE_B64" | tr -d " \r\n\t")
          echo "Tamanho do segredo ANDROID_KEYSTORE_BASE64: ${#LIMPO} caracteres (esperado: 3576)"
          if ! printf "%s" "$LIMPO" | base64 -d > keystore/central-producao.jks; then
            echo "::error::O segredo ANDROID_KEYSTORE_BASE64 não é um base64 válido. Cole de novo todo o conteúdo do arquivo ANDROID_KEYSTORE_BASE64.txt, sem nada a mais."
            exit 1
          fi
          {
            echo "storeFile=../keystore/central-producao.jks"
            echo "storePassword=$KEYSTORE_SENHA"
            echo "keyAlias=centralproducao"
            echo "keyPassword=$KEYSTORE_SENHA"
          } > keystore.properties

      - name: Compilar APK assinado
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p ../saida
          cp android/app/build/outputs/apk/release/app-release.apk "../saida/central-producao-sillion-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: central-producao-sillion-apk
          path: saida/*.apk

      - name: Publicar versão (link de download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Central de Produção - Sillion v1.0.${{ github.run_number }}
          body: APK para instalar direto no celular Android.
          files: saida/*.apk
